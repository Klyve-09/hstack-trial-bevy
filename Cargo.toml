[package]
name = "drift"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small keyboard-controlled obstacle garden"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log", "bevy_state", "bevy_winit", "bevy_sprite_render", "bevy_core_pipeline", "bevy_ui_render", "default_font", "keyboard", "x11"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0
